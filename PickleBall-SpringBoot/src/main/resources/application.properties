# ── Server Configuration ────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/

# ── Database Connection (MySQL / TiDB Cloud) ───────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_DATABASE:demopick_main}?useUnicode=true&characterEncoding=utf8&sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA & Hibernate ─────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ── HikariCP Pool Optimization (Fast Startup on Render) ──
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ── JWT Authentication ──────────────────────────────────
jwt.secret=${JWT_SECRET:demopick_super_secret_key_pickleball_spring_boot_ptpmhdv_2026_secure_key_at_least_32_bytes}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS Configuration ──────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://demopick-client.vercel.app,https://demopick-admin.vercel.app,http://localhost:3000}

# ── MoMo Payment (Sandbox) ──────────────────────────────
