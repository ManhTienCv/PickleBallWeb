services:
  - type: web
    name: demopick-api
    runtime: docker
    dockerfilePath: ./PickleBall-SpringBoot/Dockerfile
    dockerContext: ./PickleBall-SpringBoot
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: DemoPick
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: demopick
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
