        value: klm05TvNBzhg7h7j
      - key: MOMO_SECRET_KEY
        sync: false
      - key: MOMO_ENDPOINT
        value: https://test-payment.momo.vn/v2/gateway/api/create
      - key: MOMO_REDIRECT_URL
        value: https://pickleball-manhtien.vercel.app/payment/momo/callback
      - key: MOMO_IPN_URL
        value: https://demopick-api.onrender.com/api/v1/webhooks/payment/momo
